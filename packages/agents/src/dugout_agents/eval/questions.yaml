# Hand-labelled evaluation questions for the agent system (Phase 3).
# Labels are *what must be answered*, not values (values change nightly; the Stat Auditor checks them):
#   agents:  specialists the Sporting Director must route to (subset of the route)
#   expect:  ledger metrics that must be cited for the named entity ("any" = any entity of that type)
#   claims:  non-numeric claims that must be published as verified (type + entity named in the sentence)
#   no_stat: unanswerable from our data; the answer must not cite any of these metrics (and must not invent one)
# Context club is Liverpool unless `club` is given.

- id: q01
  question: How many league goals has Alexander Isak scored this season?
  agents: [club]
  expect: [{metric: season_goals_scored, entity: Alexander Isak}]
- id: q02
  question: How many assists does Florian Wirtz have this season?
  agents: [club]
  expect: [{metric: season_assists, entity: Florian Wirtz}]
