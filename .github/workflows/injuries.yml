name: injuries

on:
  schedule:
    - cron: "15 */4 * * *" # every 4 hours
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-pipeline
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
    steps:
      - uses: actions/checkout@v7
      - name: Check secrets
        run: bash scripts/require_secrets.sh API_FOOTBALL_KEY
      - uses: astral-sh/setup-uv@v10.2.0 # no floating major tags since v8
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/reep
            ~/.cache/huggingface
            .cache
            data/warehouse
            data/raw
          key: pipeline-${{ github.run_id }}
          restore-keys: pipeline-
      - name: Injuries + lineups
        run: uv run dugout ingest --job injuries
      - if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cache/reep
            ~/.cache/huggingface
            .cache
            data/warehouse
            data/raw
          key: pipeline-${{ github.run_id }}
